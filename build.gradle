plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.10'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url "https://snapshots.kord.dev/"
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation("dev.kord:kord-core:0.18.1")
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}